server:
  port: 8081

spring:
  application:
    name: tracking
    
  kafka:
    # See: https://docs.conduktor.io/desktop/kafka-cluster-connection/setting-up-a-connection-to-kafka/connecting-to-kafka-running-on-windows-wsl-2/#two-ways-to-fix-this
    # and: https://stackoverflow.com/questions/46158296/kafka-broker-not-available-at-starting
    bootstrap-servers: "[::1]:9092"
    admin:
      properties:
        bootstrap.servers: "[::1]:9092"
    consumer:
      bootstrap-servers: "[::1]:9092"
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        allow.auto.create.topics: false
        
  docker:
    compose:
      enabled: false
      stop:
        command: down

management:
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"
  endpoint:
    configprops:
      # WARNING: SECURITY RISK - DO NOT USE IN PRODUCTION ENVIRONMENT
      # This configuration exposes sensitive data and should only be used for development or testing purposes.
      # Ensure this is disabled in any environment where security is a concern.
      show-values: ALWAYS
    health:
      probes:
        enabled: true
      show-details: always
  info:
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
      mode: full
  httpexchanges:
    recording:
      enabled: true
      include: request_headers, response_headers, session_id, time_taken
  observations:
    annotations:
      enabled: true
    http:
      server:
        requests:
          name: http.server.requests
      client:
        requests:
          name: http-client-requests
  tracing:
    propagation:
      type: w3c
      produce: w3c
      consume: w3c
    baggage:
      enabled: true
      # Specify which baggage fields should be propagated to downstream services
      correlation:
        # Also make baggage available in MDC for logging
        fields:
          - testBaggage
        enabled: true
      # Erlaubt das Empfangen des Headers "baggage: testBaggage=..." der im http request gesetzt wird
      remote-fields:
        - testBaggage
      # KOPIERT den Wert aus dem Baggage in die Span-Labels (Attributes)
      tag-fields:
        - testBaggage
    export:
      otlp:
        enabled: false
      enabled: true
    sampling:
      probability: 1.0

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
