apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kafka.fullname" . }}-test"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-kafka
      image: {{ .Values.kafkaImage.repository }}:{{ .Values.kafkaImage.tag }}
      imagePullPolicy: {{ .Values.kafkaImage.pullPolicy }}
      command: ['/bin/bash', '-c']
      args:
        - |
          ERROR_OCCURED=0
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=3
          BOOTSTRAP="{{ include "kafka.fullname" . }}:{{ .Values.kafka.clientPort }}"

          echo "### Test 1: Checking Kafka broker status"
          attempt=1
          rc=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list
            rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            echo "Attempt ${attempt}/${MAX_ATTEMPTS} failed (rc=${rc}); retrying in ${SLEEP_SECONDS}s..."
            attempt=$((attempt + 1))
            sleep "$SLEEP_SECONDS"
          done
          echo "Exit code: ${rc}"
          if [ "$rc" -ne 0 ]; then
            echo "Failed to connect to Kafka broker"
            ERROR_OCCURED=1
          else
            echo "Successfully connected to Kafka broker"
          fi

          echo "### Test 2: Creating a test topic"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --create --if-not-exists --topic test-topic --partitions 1 --replication-factor 1
          rc=$?
          echo "Exit code: ${rc}"
          if [ "$rc" -ne 0 ]; then
            echo "Failed to create test topic"
            ERROR_OCCURED=1
          else
            echo "Successfully created test topic"
          fi

          echo "### Test 3: Listing topics to verify test topic creation"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list | grep test-topic
          rc=$?
          echo "Exit code: ${rc}"
          if [ "$rc" -ne 0 ]; then
            echo "Test topic not found in the list"
            ERROR_OCCURED=1
          else
            echo "Test topic successfully created and listed"
          fi

          if [ "$ERROR_OCCURED" -ne 0 ]; then
            echo "### Kafka connection test failed"
            exit 1
          else
            echo "### All Kafka connection tests passed successfully"
          fi

  restartPolicy: Never
