apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "application-template.fullname" . }}-test"
  namespace: {{ .Values.global.namespace }}
  # Do not use application-template.labels here: its selector labels would make
  # this test pod a Service endpoint, so requests could hit the test pod
  # (nothing listening on the service port) instead of the application.
  labels:
    helm.sh/chart: {{ include "application-template.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-actuator-health
      image: {{ .Values.busyboxImage.repository }}:{{ .Values.busyboxImage.tag }}
      imagePullPolicy: {{ .Values.busyboxImage.pullPolicy }}
      command: [ '/bin/sh', '-c' ]
      args:
        - |
          ERROR_OCCURED=0
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=3

          check_health() {
            LABEL="$1"
            URL="$2"
            echo "### Checking health endpoint (${LABEL}): ${URL}"
            attempt=1
            rc=1
            while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
              wget -O- -q "$URL"
              rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "Exit code: ${rc}"
                return 0
              fi
              echo "Attempt ${attempt}/${MAX_ATTEMPTS} failed (rc=${rc}); retrying in ${SLEEP_SECONDS}s..."
              attempt=$((attempt + 1))
              sleep "$SLEEP_SECONDS"
            done
            echo "Exit code: ${rc}"
            return 1
          }

          if ! check_health "service short name: {{ include "application-template.fullname" . }}" \
            "{{ include "application-template.fullname" . }}:{{ .Values.service.port }}/actuator/health"; then
            ERROR_OCCURED=1
          fi

          if ! check_health "FQDN: {{ include "application-template.serviceFQDN" . }}" \
            "{{ include "application-template.serviceFQDN" . }}:{{ .Values.service.port }}/actuator/health"; then
            ERROR_OCCURED=1
          fi

          if [ "$ERROR_OCCURED" -ne 0 ]; then
            # Print DNS configuration
            echo "### DNS Configuration:"
            cat /etc/resolv.conf || true

            # Test DNS resolution
            echo "### Testing DNS resolution:"
            AP_FQDN="{{ include "application-template.serviceFQDN" . }}"
            echo "nslookup AP_FQDN: ${AP_FQDN}"
            nslookup "${AP_FQDN}" || true

            exit 1
          fi

          exit 0

  restartPolicy: Never
